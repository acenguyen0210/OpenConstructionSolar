<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875A" />
      <stop offset="100%" stop-color="#005236" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C8E6C9" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Sun Rays & Core -->
  <circle cx="100" cy="72" r="34" fill="url(#sunGrad)" />
  <g stroke="#FFA000" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="24" x2="100" y2="14" />
    <line x1="100" y1="120" x2="100" y2="130" />
    <line x1="52" y1="72" x2="42" y2="72" />
    <line x1="148" y1="72" x2="158" y2="72" />
    <line x1="66" y1="38" x2="59" y2="31" />
    <line x1="134" y1="106" x2="141" y2="113" />
    <line x1="66" y1="106" x2="59" y2="113" />
    <line x1="134" y1="38" x2="141" y2="31" />
  </g>

  <!-- Solar PV Panel Perspective Trapezoid -->
  <polygon points="40,165 160,165 145,110 55,110" fill="url(#panelGrad)" stroke="#004D40" stroke-width="2" />

  <!-- Grid lines on panel -->
  <!-- Horizontal lines -->
  <line x1="50" y1="128" x2="150" y2="128" stroke="url(#gridGrad)" stroke-width="2" />
  <line x1="45" y1="146" x2="155" y2="146" stroke="url(#gridGrad)" stroke-width="2" />

  <!-- Vertical lines -->
  <line x1="77" y1="110" x2="70" y2="165" stroke="url(#gridGrad)" stroke-width="2" />
  <line x1="100" y1="110" x2="100" y2="165" stroke="url(#gridGrad)" stroke-width="2" />
  <line x1="123" y1="110" x2="130" y2="165" stroke="url(#gridGrad)" stroke-width="2" />

  <!-- Vietnam Flag Accent Star on panel top corner -->
  <polygon points="100,58 103,67 112,67 105,72 108,81 100,76 92,81 95,72 88,67 97,67" fill="#FFFDE7" />
</svg>

